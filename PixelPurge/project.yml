name: PixelPurge
options:
  bundleIdPrefix: com.haapark
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  PixelPurge:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/PixelPurge
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: PixelPurge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "PixelPurge는 기기 안에서만 사진을 분석해 중복·유사 사진, 스크린샷, 큰 동영상을 찾아드려요. 어떤 사진도 외부로 전송되지 않아요."
    entitlements:
      path: Generated.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haapark.pixelpurge
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
      gatherCoverageData: false
